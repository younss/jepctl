[package]
name = "jepctl"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "jepctl: local runtime, CLI and testbench for JEPA style encoders (I-JEPA, V-JEPA 2, DINOv2, ViT, AudioMAE), like Ollama for representation learning"
authors = ["Younss <younssiga@gmail.com>", "jepctl contributors"]
license = "Apache-2.0"
repository = "https://github.com/younss/jepctl"
homepage = "https://github.com/younss/jepctl"
readme = "README.md"
keywords = ["jepa", "vision-transformer", "embeddings", "candle", "local-ai"]
categories = ["command-line-utilities", "computer-vision", "science"]
exclude = ["packaging/", ".github/", "docs/"]

[features]
# No accelerator by default so `cargo build` works on every platform.
# Enable one explicitly: `--features metal` (Apple Silicon) or `--features cuda` (NVIDIA).
default = []
metal = ["candle-core/metal", "candle-nn/metal", "dep:objc2-metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Physical robot arm over USB serial (Feetech STS / Dynamixel 1.0 style frames).
serial = ["dep:serialport"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
# Inference engine
candle-core = "0.11.0"
candle-nn = "0.11.0"

# Async runtime & Web server
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axum = { version = "0.8.9", features = ["multipart", "tokio", "json", "ws"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
futures-util = "0.3.34"

# Logging and Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# CLI & Configuration
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"

# Serialization & Cryptography
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
rand = "0.10.2"
hex = "0.4.3"
base64 = "0.22"
uuid = { version = "1.26.1", features = ["v4", "rng"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Media & Hardware
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
sysinfo = "0.39.6"

# Hub Client & Network (Hugging Face resolve URLs are fetched directly)
reqwest = { version = "0.13.5", features = ["json", "stream"] }

# GPU memory diagnostics on Metal (optional, pulled in by the metal feature)
objc2-metal = { version = "0.3", optional = true }

# Robotics (optional)
serialport = { version = "4.3", optional = true }

# Error Handling & Utilities
thiserror = "2.0.20"
async-stream = "0.3.6"
wry = "0.57.0"
tao = "0.37.0"
cpal = "0.18"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
